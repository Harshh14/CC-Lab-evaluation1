<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Service</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #172033;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-top: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 13px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #eef2ff;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
        }

        @media(max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Student Management Portal</h1>
    <p>Student Service • Port 5001</p>
</header>

<div class="container">

    <div class="card">

        <h2>Add New Student</h2>

        <form id="studentForm">

            <div class="form-grid">

                <input
                    type="number"
                    id="student_id"
                    placeholder="Student ID"
                    required
                >

                <input
                    type="text"
                    id="name"
                    placeholder="Student Name"
                    required
                >

                <input
                    type="text"
                    id="branch"
                    placeholder="Branch"
                    required
                >

                <input
                    type="number"
                    id="year"
                    placeholder="Year"
                    min="1"
                    max="6"
                    required
                >

            </div>

            <br>

            <button type="submit">
                Add Student
            </button>

        </form>

        <div id="message" class="message"></div>

    </div>


    <div class="card">

        <h2>Students</h2>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Branch</th>
                    <th>Year</th>
                </tr>
            </thead>

            <tbody id="studentTable"></tbody>

        </table>

    </div>

</div>


<script>

async function loadStudents() {

    const response = await fetch("/students");

    const students = await response.json();

    const table = document.getElementById("studentTable");

    table.innerHTML = "";

    students.forEach(student => {

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${student.student_id}</td>
            <td>${student.name}</td>
            <td>${student.branch}</td>
            <td>${student.year}</td>
        `;

        table.appendChild(row);

    });
}


document
    .getElementById("studentForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const data = {

            student_id:
                document.getElementById("student_id").value,

            name:
                document.getElementById("name").value,

            branch:
                document.getElementById("branch").value,

            year:
                document.getElementById("year").value

        };


        const response = await fetch("/students", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(data)

        });


        const result = await response.json();

        const message =
            document.getElementById("message");


        if (response.ok) {

            message.style.color = "green";

            message.textContent =
                "Student added successfully!";

            document.getElementById("studentForm").reset();

            loadStudents();

        } else {

            message.style.color = "red";

            message.textContent =
                result.error || "Failed to add student";

        }

    });


loadStudents();

</script>

</body>
</html>
