<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Course Service</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #172033;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 13px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #eef2ff;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
        }

        @media(max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

<header>

    <h1>Student Management Portal</h1>

    <p>Course Service • Port 5002</p>

</header>


<div class="container">

    <div class="card">

        <h2>Add New Course</h2>

        <form id="courseForm">

            <div class="form-grid">

                <input
                    type="text"
                    id="course_id"
                    placeholder="Course ID"
                    required
                >

                <input
                    type="text"
                    id="course_name"
                    placeholder="Course Name"
                    required
                >

                <input
                    type="number"
                    id="credits"
                    placeholder="Credits"
                    min="1"
                    max="10"
                    required
                >

                <input
                    type="text"
                    id="department"
                    placeholder="Department"
                    required
                >

            </div>

            <br>

            <button type="submit">
                Add Course
            </button>

        </form>

        <div
            id="message"
            class="message"
        ></div>

    </div>


    <div class="card">

        <h2>Courses</h2>

        <table>

            <thead>

                <tr>

                    <th>Course ID</th>
                    <th>Course Name</th>
                    <th>Credits</th>
                    <th>Department</th>

                </tr>

            </thead>

            <tbody id="courseTable"></tbody>

        </table>

    </div>

</div>


<script>

async function loadCourses() {

    const response =
        await fetch("/courses");

    const courses =
        await response.json();

    const table =
        document.getElementById("courseTable");

    table.innerHTML = "";

    courses.forEach(course => {

        const row =
            document.createElement("tr");

        row.innerHTML = `

            <td>${course.course_id}</td>

            <td>${course.course_name}</td>

            <td>${course.credits}</td>

            <td>${course.department}</td>

        `;

        table.appendChild(row);

    });
}


document
    .getElementById("courseForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const data = {

            course_id:
                document.getElementById("course_id").value,

            course_name:
                document.getElementById("course_name").value,

            credits:
                document.getElementById("credits").value,

            department:
                document.getElementById("department").value

        };


        const response =
            await fetch("/courses", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(data)

            });


        const result =
            await response.json();

        const message =
            document.getElementById("message");


        if (response.ok) {

            message.style.color = "green";

            message.textContent =
                "Course added successfully!";

            document
                .getElementById("courseForm")
                .reset();

            loadCourses();

        } else {

            message.style.color = "red";

            message.textContent =
                result.error || "Failed to add course";

        }

    });


loadCourses();

</script>

</body>

</html>
